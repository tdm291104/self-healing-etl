crypto_etl:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_DB_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_DB_USER', 'dbt_user') }}"
      password: "{{ env_var('DBT_DB_PASSWORD', 'dbt_password') }}"
      port: 5432
      dbname: "{{ env_var('DBT_DB_NAME', 'crypto_dw') }}"
      schema: staging
      threads: 4
      keepalives_idle: 0
